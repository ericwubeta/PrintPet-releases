name: 反馈 Bug
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
assignees: [ericwubeta]
body:
  - type: dropdown
    id: product
    attributes:
      label: 产品
      options:
        - Windows 桌面版
        - PrintPet Core
        - PrintPet Spirit
        - PrintPet Kindle
        - PrintPet 官网
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与使用环境
      placeholder: 例如 Core 1.6.2、AI Passport、拓竹 X2D
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 写下操作步骤、实际发生的情况和预期结果。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志（可选）
      description: 公开提交前，请遮盖账号、序列号和密钥。
